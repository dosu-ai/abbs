name: release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: verify immutable action references
        run: bash scripts/check-action-pins.sh
      - name: lint installer and release shell scripts
        run: shellcheck install.sh scripts/*.sh
      - name: install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0
      - name: install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          install-only: true
      - name: validate GoReleaser configuration
        run: goreleaser check
      - name: build snapshot artifacts
        run: goreleaser release --snapshot --clean --skip=sign
      - name: verify archive matrix and metadata
        run: bash scripts/verify-release.sh dist
      - name: upload the exact snapshot bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abbs-snapshot
          path: dist/
          if-no-files-found: error
          retention-days: 7

  native:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            installer: shell
          - runner: windows-2025
            installer: powershell
          - runner: macos-15-intel
            installer: shell
          - runner: macos-15
            installer: shell
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: abbs-snapshot
          path: dist
      - name: execute native binary and shell installer
        if: matrix.installer == 'shell'
        run: bash scripts/test-install.sh dist
      - name: execute native binary and PowerShell installer
        if: matrix.installer == 'powershell'
        shell: pwsh
        run: ./scripts/test-install.ps1 -DistDir dist
