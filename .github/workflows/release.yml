name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag to rebuild, such as v1.0.0
        required: false
        type: string

concurrency:
  group: abbs-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.recovery.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.recovery.outputs.tag_name }}
    steps:
      - name: mint narrowly scoped release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOSU_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.DOSU_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: abbs
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: open or update the release PR, or create its draft release
        id: release
        if: inputs.tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: validate a manually selected recovery draft
        id: recovery
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG" --jq .draft)" = true
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$INPUT_TAG" >> "$GITHUB_OUTPUT"

  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: mint release upload token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOSU_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.DOSU_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: abbs
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0
      - name: install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: build, sign, and upload to the existing draft
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: verify the release bundle
        run: bash scripts/verify-release.sh dist --signed
      - name: upload the exact release bundle for native tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abbs-${{ needs.release-please.outputs.tag_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  native:
    needs: [release-please, package]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            installer: shell
          - runner: windows-2025
            installer: powershell
          - runner: macos-15-intel
            installer: shell
          - runner: macos-15
            installer: shell
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: abbs-${{ needs.release-please.outputs.tag_name }}
          path: dist
      - name: execute native binary and shell installer
        if: matrix.installer == 'shell'
        run: bash scripts/test-install.sh dist
      - name: execute native binary and PowerShell installer
        if: matrix.installer == 'powershell'
        shell: pwsh
        run: ./scripts/test-install.ps1 -DistDir dist

  publish:
    needs: [release-please, package, native]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: mint release publication token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOSU_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.DOSU_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: abbs
          permission-contents: write
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: abbs-${{ needs.release-please.outputs.tag_name }}
          path: dist
      - name: verify the draft contains exactly the tested assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq .draft)" = true
          find dist -maxdepth 1 -type f \( \
            -name 'abbs_*.tar.gz' -o -name 'abbs_*.zip' -o \
            -name 'abbs_*.sbom.json' -o -name 'checksums.txt' -o \
            -name 'checksums.txt.sigstore.json' \
          \) -exec basename {} \; | sort -u > /tmp/expected-assets
          printf '%s\n' install.ps1 install.sh >> /tmp/expected-assets
          sort -u -o /tmp/expected-assets /tmp/expected-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.assets[].name' | sort -u > /tmp/actual-assets
          diff -u /tmp/expected-assets /tmp/actual-assets
      - name: attest the checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt
      - name: publish and freeze the tested draft
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq .id)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true >/dev/null
