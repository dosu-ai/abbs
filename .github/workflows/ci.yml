name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -shuffle=on ./...
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auth: [first-claim, api-key]
        visibility: [private, public]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: black-box conformance suite (${{ matrix.auth }}, ${{ matrix.visibility }})
        env:
          ABBS_AUTH_MODE: ${{ matrix.auth }}
          ABBS_VISIBILITY: ${{ matrix.visibility }}
        run: cd conformance && go vet ./... && go test -count=1 -shuffle=on ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: container image builds and serves
        run: |
          docker build -t abbs .
          docker run -d --name abbs -p 8080:8080 abbs
          for i in $(seq 50); do curl -sf http://127.0.0.1:8080/v1/server && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8080/v1/server | grep -q api-key
  cfworker:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: cfworker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cfworker/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: unit tests (vitest-pool-workers, on workerd)
        run: npx vitest run
      - name: boot wrangler dev in all auth and visibility configurations
        run: |
          # Distinct inspector ports: parallel wrangler dev instances cannot
          # share the default 9229 port.
          npx wrangler dev --port 8787 --inspector-port 9229 --persist-to "$(mktemp -d)" >/tmp/wrangler-first-claim.log 2>&1 &
          ADMIN_TOKEN="abbs_ci_$(openssl rand -hex 24)"
          echo "ABBS_ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          printf 'ADMIN_BOOTSTRAP_TOKEN=%s\n' "$ADMIN_TOKEN" > .dev.vars.apikey
          printf 'ADMIN_BOOTSTRAP_TOKEN=%s\n' "$ADMIN_TOKEN" > .dev.vars.public-apikey
          npx wrangler dev -e apikey --port 8788 --inspector-port 9230 --persist-to "$(mktemp -d)" >/tmp/wrangler-apikey.log 2>&1 &
          npx wrangler dev -e public --port 8789 --inspector-port 9231 --persist-to "$(mktemp -d)" >/tmp/wrangler-public.log 2>&1 &
          npx wrangler dev -e public-apikey --port 8790 --inspector-port 9232 --persist-to "$(mktemp -d)" >/tmp/wrangler-public-apikey.log 2>&1 &
          for i in $(seq 120); do curl -sf http://127.0.0.1:8787/v1/server >/dev/null && break; sleep 0.5; done
          for i in $(seq 120); do curl -sf http://127.0.0.1:8788/v1/server >/dev/null && break; sleep 0.5; done
          for i in $(seq 120); do curl -sf http://127.0.0.1:8789/v1/server >/dev/null && break; sleep 0.5; done
          for i in $(seq 120); do curl -sf http://127.0.0.1:8790/v1/server >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8787/v1/server | grep -q first-claim
          curl -sf http://127.0.0.1:8788/v1/server | grep -q api-key
          curl -sf http://127.0.0.1:8789/v1/server | grep -q '"visibility":"public"'
          curl -sf http://127.0.0.1:8790/v1/server | grep -q '"visibility":"public"'
      - name: conformance suite, first-claim configuration
        working-directory: conformance
        run: ABBS_BASE_URL=http://127.0.0.1:8787 go test -count=1 -shuffle=on ./...
      - name: conformance suite, api-key configuration
        working-directory: conformance
        run: ABBS_BASE_URL=http://127.0.0.1:8788 go test -count=1 -shuffle=on ./...
      - name: conformance suite, public first-claim configuration
        working-directory: conformance
        run: ABBS_BASE_URL=http://127.0.0.1:8789 ABBS_VISIBILITY=public go test -count=1 -shuffle=on ./...
      - name: conformance suite, public api-key configuration
        working-directory: conformance
        run: ABBS_BASE_URL=http://127.0.0.1:8790 ABBS_VISIBILITY=public ABBS_ADMIN_TOKEN="$ABBS_ADMIN_TOKEN" go test -count=1 -shuffle=on ./...
      - uses: astral-sh/setup-uv@v5
      - name: schemathesis against the cfworker server
        working-directory: .
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8787/v1/users \
            -H 'Content-Type: application/json' \
            --data '{"username":"fuzzbot","kind":"agent"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          # Event-stream transports are covered by the conformance suite.
          # Schemathesis cannot exercise a WebSocket after its HTTP upgrade,
          # and fuzzing the long-poll just burns wall-clock on holds.
          uvx schemathesis run spec/abbs.openapi.yaml --url http://127.0.0.1:8787 \
            -H "Authorization: Bearer $TOKEN" \
            --exclude-path /v1/events --exclude-path /v1/events/ws --max-examples 20 \
            --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
      - name: wrangler logs on failure
        if: failure()
        run: |
          echo "=== first-claim ==="; cat /tmp/wrangler-first-claim.log || true
          echo "=== api-key ==="; cat /tmp/wrangler-apikey.log || true
          echo "=== public first-claim ==="; cat /tmp/wrangler-public.log || true
          echo "=== public api-key ==="; cat /tmp/wrangler-public-apikey.log || true
  web:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck (worker + browser script)
        run: npm run typecheck
      - name: unit and integration tests (vitest-pool-workers, on workerd)
        run: npx vitest run
      - name: boot wrangler dev with a migrated, seeded registry
        run: |
          # Shared default local persistence: migrations and seed land in the
          # same .wrangler state wrangler dev reads.
          npx wrangler d1 migrations apply abbs-directory --local
          npx wrangler d1 execute abbs-directory --local --file seed/local.sql
          npx wrangler dev --port 8791 --inspector-port 9239 --test-scheduled >/tmp/wrangler-web.log 2>&1 &
          for i in $(seq 120); do curl -sf http://127.0.0.1:8791/help >/dev/null && break; sleep 0.5; done
          # The seeded upstreams are not running here: the directory must
          # still render, labeling them rather than failing.
          curl -sf http://127.0.0.1:8791/ | grep -q "ABBS PUBLIC DIRECTORY"
          curl -sf http://127.0.0.1:8791/ | grep -qi "local-go"
          curl -sf http://127.0.0.1:8791/add | grep -q "directory_listing"
          curl -sf http://127.0.0.1:8791/styles.css | grep -q "IBM VGA"
          curl -sf http://127.0.0.1:8791/api/workspaces | grep -q '"slug":"local-cf"'
          # Phase 3 registration surface: the no-JS form and the JSON API
          # reject a non-HTTPS submission with precise, bounded errors.
          curl -sf http://127.0.0.1:8791/add | grep -q 'form method="post" action="/add"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data 'url=http://plain.example.com' http://127.0.0.1:8791/add)" = "400"
          curl -s -X POST --data 'url=http://plain.example.com' http://127.0.0.1:8791/add | grep -q "SERVED OVER HTTPS"
          curl -s -X POST -H 'Content-Type: application/json' --data '{"url":"https://127.0.0.1"}' http://127.0.0.1:8791/api/workspaces | grep -q '"type":".*validation"'
          # Scheduled re-verification: trigger the cron handler; the dead
          # seed upstreams must be swept to unreachable, not delisted.
          curl -sf "http://127.0.0.1:8791/__scheduled?cron=*+*+*+*+*" >/dev/null
          curl -sf http://127.0.0.1:8791/api/workspaces | grep -q '"status":"unreachable"'
          curl -sf http://127.0.0.1:8791/api/workspaces | grep -q '"last_error_code":"network"'
      - name: wrangler logs on failure
        if: failure()
        run: cat /tmp/wrangler-web.log || true
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v5
      - name: schemathesis against a live server
        run: |
          go build -o /tmp/abbs ./cmd/abbs
          /tmp/abbs serve -addr 127.0.0.1:8080 -db /tmp/fuzz.db &
          for i in $(seq 50); do curl -sf http://127.0.0.1:8080/v1/server >/dev/null && break; sleep 0.2; done
          TOKEN=$(/tmp/abbs claim -url http://127.0.0.1:8080 -username fuzzbot 2>/dev/null)
          # Event-stream transports are covered by the conformance suite.
          # Schemathesis cannot exercise a WebSocket after its HTTP upgrade,
          # and fuzzing the long-poll just burns wall-clock on holds.
          uvx schemathesis run spec/abbs.openapi.yaml --url http://127.0.0.1:8080 \
            -H "Authorization: Bearer $TOKEN" \
            --exclude-path /v1/events --exclude-path /v1/events/ws --max-examples 20 \
            --checks not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: redocly lint
        run: npx --yes @redocly/cli@2 lint spec/abbs.openapi.yaml
      - uses: astral-sh/setup-uv@v5
      - name: schemathesis parses the spec
        # Full schemathesis fuzzing runs against a live server from M2 on;
        # here we assert the document loads and every operation is generatable.
        run: |
          uv run --with schemathesis python3 - <<'EOF'
          import schemathesis
          schema = schemathesis.openapi.from_path("spec/abbs.openapi.yaml")
          ops = [op.ok().label for op in schema.get_all_operations()]
          assert len(ops) >= 30, ops
          print(f"ok: {len(ops)} operations")
          EOF
